<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balloon · LY Balloon Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap">
  <link rel="stylesheet" href="styles.css?v=13">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="data.js?v=15"></script>
</head>
<body class="details-page">
  <header class="site-nav">
    <a class="site-brand" href="index.html">
      LY-Register
      <span class="site-flag" aria-hidden="true"><span></span><span></span><span></span></span>
    </a>
    <div class="site-links">
      <span>Manufacturers</span>
      <span>Clubs</span>
      <span>Links</span>
      <span>About</span>
    </div>
  </header>
  <nav class="topbar" aria-label="Breadcrumb">
    <a class="crumb-back" id="back" href="index.html">‹ All balloons</a>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <span class="crumb-current" id="crumb" aria-current="page"></span>
  </nav>
  <main class="details-main" id="content"></main>
  <nav class="pager" id="pager" aria-label="Other balloons"></nav>

  <script>
    const content = document.getElementById("content");
    const id = new URLSearchParams(location.search).get("id");

    // Return to the list with its filters intact when we came from it.
    if (document.referrer) {
      const ref = new URL(document.referrer);
      if (ref.origin === location.origin && /\/(index\.html)?$/.test(ref.pathname)) {
        document.getElementById("back").href = ref.pathname + ref.search;
      }
    }

    // First of several possible column names that exists in the row (the sheet spells one "contruction no.").
    function col(row, ...names) {
      const name = names.find((n) => n in row);
      return name ? row[name] : "";
    }

    function withUnit(value, unit) {
      if (isBlank(value)) return "—";
      return unit && !value.includes(unit.trim()) ? `${value} ${unit}` : value;
    }

    // Label above value, as in the "Detail row" component.
    function infoCell(label, value, extra, valueAttrs = {}) {
      return el("div", { class: "info-cell" },
        el("dt", { class: "info-label" }, label),
        el("dd", { ...valueAttrs, class: `info-value${value === "—" ? " blank" : ""} ${valueAttrs.class || ""}`.trim() }, value, extra));
    }

    // True for a YYYY-MM-DD date before today (local time); false for anything else.
    function isPast(value) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec((value || "").trim());
      if (!m) return false;
      const now = new Date();
      const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      return m[0] < today;
    }

    // Grey "Detail row Alt" box; left out when there is nothing to show.
    function infoRow(label, value) {
      if (value == null || (typeof value === "string" && isBlank(value))) return null;
      if (typeof value === "string" && /^https?:\/\//i.test(value.trim())) {
        value = el("a", { href: value.trim(), target: "_blank", rel: "noopener noreferrer" }, "Open link ↗");
      }
      return el("div", { class: "info-row" },
        el("dt", { class: "info-label" }, label),
        el("dd", { class: "info-value" }, value));
    }

    // Swipeable photo strip; with one photo it's a plain image, with none the placeholder.
    function carousel(srcs, alt) {
      const wrap = el("div", { class: "img-wrap carousel" });
      const track = el("div", { class: "carousel-track" });
      const prev = el("button", { class: "carousel-btn prev", type: "button", "aria-label": "Previous photo" }, "‹");
      const next = el("button", { class: "carousel-btn next", type: "button", "aria-label": "Next photo" }, "›");
      const dots = el("div", { class: "carousel-dots" });
      const counter = el("span", { class: "carousel-count", "aria-live": "polite" });
      const placeholder = el("div", { class: "img-placeholder", "aria-hidden": "true" }, balloonIcon());
      let current = 0;

      const slides = () => [...track.children];
      const go = (i) => {
        const n = slides().length;
        current = Math.max(0, Math.min(n - 1, i));
        track.scrollTo({ left: current * track.clientWidth, behavior: "smooth" });
      };

      function update() {
        const n = slides().length;
        wrap.classList.toggle("empty", n === 0);
        placeholder.hidden = n > 0;
        const multi = n > 1;
        wrap.classList.toggle("multi", multi);
        wrap.tabIndex = multi ? 0 : -1;
        counter.textContent = `${current + 1} / ${n}`;
        prev.disabled = current === 0;
        next.disabled = current === n - 1;
        dots.replaceChildren(...slides().map((_, i) =>
          el("button", { type: "button", class: "dot", "aria-label": `Photo ${i + 1}`, "aria-current": i === current ? "true" : null, onclick: () => go(i) })));
      }

      function addPhoto(src) {
        // Not lazy: a missing photo should drop out before anyone swipes to it.
        const img = el("img", { src, alt: `${alt}, photo ${slides().length + 1}`, draggable: "false" });
        const slide = el("div", { class: "slide" }, img);
        img.addEventListener("error", () => { slide.remove(); current = Math.max(0, Math.min(current, slides().length - 1)); update(); });
        track.append(slide);
        update();
      }

      let frame;
      track.addEventListener("scroll", () => {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          const i = Math.round(track.scrollLeft / track.clientWidth);
          if (i !== current) { current = i; update(); }
        });
      });
      prev.addEventListener("click", () => go(current - 1));
      next.addEventListener("click", () => go(current + 1));
      wrap.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") { e.preventDefault(); go(current - 1); }
        if (e.key === "ArrowRight") { e.preventDefault(); go(current + 1); }
      });

      wrap.setAttribute("aria-roledescription", "carousel");
      wrap.setAttribute("aria-label", `${alt} photos`);
      wrap.append(track, placeholder, prev, next, dots, counter);
      update();
      srcs.forEach(addPhoto);
      wrap.addPhoto = addPhoto;
      return wrap;
    }

    function render([rows, photoIndex]) {
      const index = rows.findIndex((r) => r.id === id);
      if (index === -1) {
        content.replaceChildren(el("p", { class: "empty" }, `No balloon with id “${id || ""}”.`));
        return;
      }
      const row = rows[index];
      const reg = regMark(row);
      document.title = `${reg} · LY Balloon Register`;

      const status = row["CAA status"];
      document.getElementById("crumb").textContent = reg;

      const aircraft = [
        ["Manufacturer", row.manufacturer],
        ["Model", row.model],
        ["Construction no.", col(row, "construction no.", "contruction no.")],
        ["Volume", withUnit(row.volume, "m³")],
        ["Build year", row["build year"]],
        [el("abbr", { title: "Maximum Takeoff Weight" }, "Takeoff Weight"), withUnit(row.MTOW, "kg")],
      ];
      // Balloons that came to Lithuania new get a green mark after their registration date.
      const fresh = (col(row, ".freshness", "freshness") || "").trim().toLowerCase() === "arrived fresh"
        ? el("span", { class: "fresh-mark", title: "Arrived fresh", "aria-label": "Arrived fresh" }, "✱") : null;
      const registration = [
        ["CAA registration", row["CAA registration"], fresh],
        ["CAA status", isBlank(status) ? "" : STATUS_STYLES[statusSlug(status)][0]],
        ["CAA last update", row["CAA last update"]],
        ["ARC expiry", row["ARC expiry"], null,
          isPast(row["ARC expiry"]) ? { class: "expired", title: "Expired" } : undefined],
      ];
      const grid = (cells) => el("dl", { class: "info-grid" },
        cells.map(([label, value, extra, attrs]) => infoCell(label, isBlank(value) ? "—" : value, extra, attrs)));

      // Columns shown above; any other column (except private "." ones) gets a grey row before Tags.
      const shown = new Set(["id", "registration mark", "branding", "branding extra", "manufacturer", "model",
        "construction no.", "contruction no.", "volume", "build year", "MTOW", "CAA registration", "CAA status",
        "CAA last update", "ARC expiry", "reg. history", "owner", "notes", "tags"]);
      const extras = Object.keys(row).filter((c) => !c.trim().startsWith(".") && !shown.has(c));
      const tags = splitTags(row.tags);

      const title = el("div", { class: "title-row" }, el("h1", {}, reg), statusPill(status));
      title.lastChild.classList.add("status-lg");
      const name = [row.branding, row["branding extra"]].some((v) => !isBlank(v))
        ? el("p", { class: "name" },
            isBlank(row.branding) ? null : el("strong", {}, row.branding),
            isBlank(row["branding extra"]) ? null : `${isBlank(row.branding) ? "" : "· "}${row["branding extra"]}`)
        : null;

      const sorted = rows.slice().sort(byReg);
      const pos = sorted.indexOf(row);
      const prev = sorted[pos - 1];
      const next = sorted[pos + 1];
      const markOf = (r) => isBlank(r["registration mark"]) ? r.id : r["registration mark"];
      const link = (r, dir) => !r ? el("span") :
        el("a", { href: `details.html?id=${encodeURIComponent(r.id)}`, rel: dir },
          dir === "prev" ? [el("span", { "aria-hidden": "true" }, "←"), markOf(r)] : [markOf(r), el("span", { "aria-hidden": "true" }, "→")]);
      document.getElementById("pager").replaceChildren(link(prev, "prev"), link(next, "next"));

      // index.json lists every photo; only without it do we look for more <id>__N.jpg files.
      const photos = photoSrcs(row, photoIndex);
      const gallery = carousel(photos, `${reg} balloon`);
      if (!photoIndex && photos.length) findMorePhotos(row.id, photos.length + 1, gallery.addPhoto);

      content.replaceChildren(
        el("article", { class: "detail" },
          gallery,
          el("div", { class: "detail-info" },
            el("section", { class: "info-top" },
              el("header", { class: "detail-head" }, title, name),
              el("hr", { class: "divider" }),
              grid(aircraft),
              el("hr", { class: "divider" }),
              grid(registration)),
            el("dl", { class: "info-rows" },
              infoRow("Registration history", row["reg. history"]),
              infoRow("Owner", row.owner),
              infoRow("Notes", row.notes),
              extras.map((c) => infoRow(labelFor(c).replace(/^./, (ch) => ch.toUpperCase()), row[c])),
              tags.length ? infoRow("Tags", el("div", { class: "tags" }, tags.map(tagPill))) : null))));
    }

    Promise.all([loadBalloons(), loadPhotoIndex()]).then(render).catch((err) => {
      console.error(err);
      content.replaceChildren(el("p", { class: "error" }, "Couldn't load the register."));
    });
  </script>
</body>
</html>
