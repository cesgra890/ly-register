<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balloon · LY Balloon Register</title>
  <link rel="stylesheet" href="styles.css?v=4">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="data.js?v=4"></script>
</head>
<body>
  <main class="page">
    <a class="back" id="back" href="index.html">← All balloons</a>
    <div id="content"></div>
  </main>

  <script>
    const content = document.getElementById("content");
    const id = new URLSearchParams(location.search).get("id");

    // Return to the list with its filters intact when we came from it.
    if (document.referrer) {
      const ref = new URL(document.referrer);
      if (ref.origin === location.origin && /\/(index\.html)?$/.test(ref.pathname)) {
        document.getElementById("back").href = ref.pathname + ref.search;
      }
    }

    function fieldValue(column, value) {
      if (isBlank(value)) return el("dd", { class: "blank" }, "—");
      if (column === "CAA status") return el("dd", {}, statusPill(value));
      if (column === "tags") {
        return el("dd", {}, el("div", { class: "chips" }, splitTags(value).map(tagPill)));
      }
      if (column === "reg. history") {
        return el("dd", {}, el("div", { class: "chips" }, splitTags(value).map((t) => el("span", { class: "chip" }, t))));
      }
      if (/^https?:\/\//i.test(value.trim())) {
        return el("dd", {}, el("a", { href: value.trim(), target: "_blank", rel: "noopener noreferrer" }, "Open link ↗"));
      }
      return el("dd", {}, value);
    }

    // Swipeable photo strip; with one photo it's a plain image, with none the placeholder.
    function carousel(srcs, alt) {
      const wrap = el("div", { class: "img-wrap carousel" });
      const track = el("div", { class: "carousel-track" });
      const prev = el("button", { class: "carousel-btn prev", type: "button", "aria-label": "Previous photo" }, "‹");
      const next = el("button", { class: "carousel-btn next", type: "button", "aria-label": "Next photo" }, "›");
      const dots = el("div", { class: "carousel-dots" });
      const counter = el("span", { class: "carousel-count", "aria-live": "polite" });
      const placeholder = el("div", { class: "img-placeholder", "aria-hidden": "true" }, balloonIcon());
      let current = 0;

      const slides = () => [...track.children];
      const go = (i) => {
        const n = slides().length;
        current = Math.max(0, Math.min(n - 1, i));
        track.scrollTo({ left: current * track.clientWidth, behavior: "smooth" });
      };

      function update() {
        const n = slides().length;
        wrap.classList.toggle("empty", n === 0);
        placeholder.hidden = n > 0;
        const multi = n > 1;
        wrap.classList.toggle("multi", multi);
        wrap.tabIndex = multi ? 0 : -1;
        counter.textContent = `${current + 1} / ${n}`;
        prev.disabled = current === 0;
        next.disabled = current === n - 1;
        dots.replaceChildren(...slides().map((_, i) =>
          el("button", { type: "button", class: "dot", "aria-label": `Photo ${i + 1}`, "aria-current": i === current ? "true" : null, onclick: () => go(i) })));
      }

      function addPhoto(src) {
        // Not lazy: a missing photo should drop out before anyone swipes to it.
        const img = el("img", { src, alt: `${alt}, photo ${slides().length + 1}`, draggable: "false" });
        const slide = el("div", { class: "slide" }, img);
        img.addEventListener("error", () => { slide.remove(); current = Math.max(0, Math.min(current, slides().length - 1)); update(); });
        track.append(slide);
        update();
      }

      let frame;
      track.addEventListener("scroll", () => {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          const i = Math.round(track.scrollLeft / track.clientWidth);
          if (i !== current) { current = i; update(); }
        });
      });
      prev.addEventListener("click", () => go(current - 1));
      next.addEventListener("click", () => go(current + 1));
      wrap.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") { e.preventDefault(); go(current - 1); }
        if (e.key === "ArrowRight") { e.preventDefault(); go(current + 1); }
      });

      wrap.setAttribute("aria-roledescription", "carousel");
      wrap.setAttribute("aria-label", `${alt} photos`);
      wrap.append(track, placeholder, prev, next, dots, counter);
      update();
      srcs.forEach(addPhoto);
      wrap.addPhoto = addPhoto;
      return wrap;
    }

    function render([rows, photoIndex]) {
      const index = rows.findIndex((r) => r.id === id);
      if (index === -1) {
        content.replaceChildren(el("p", { class: "empty" }, `No balloon with id “${id || ""}”.`));
        return;
      }
      const row = rows[index];
      const reg = regMark(row);
      document.title = `${reg} · LY Balloon Register`;

      const status = row["CAA status"];
      const model = [row["manufacturer"], row.model].filter((v) => !isBlank(v)).join(" ");
      const subtitle = [row.branding, row["branding extra"]].filter((v) => !isBlank(v)).join(" — ");

      const fields = el("dl", { class: "fields" },
        // Columns starting with "." are private notes for the sheet, not for visitors.
        Object.keys(row).filter((col) => !col.trim().startsWith(".")).flatMap((col) => {
          const dd = fieldValue(col, row[col]);
          // Balloons that came to Lithuania new get a green mark after their registration date.
          if (col === "CAA registration" && (row.freshness || "").trim().toLowerCase() === "arrived fresh") {
            dd.append(el("span", { class: "fresh-mark", title: "Arrived fresh", "aria-label": "Arrived fresh" }, "✱"));
          }
          return [el("dt", {}, labelFor(col)), dd];
        }));

      const sorted = rows.slice().sort(byReg);
      const pos = sorted.indexOf(row);
      const prev = sorted[pos - 1];
      const next = sorted[pos + 1];
      const link = (r, text) => r ? el("a", { href: `details.html?id=${encodeURIComponent(r.id)}` }, text) : el("span");
      const markOf = (r) => r && (isBlank(r["registration mark"]) ? r.id : r["registration mark"]);

      // index.json may be missing or out of date (e.g. photos uploaded by hand),
      // so also look for further <id>-N.jpg files beyond what it lists.
      const photos = photoSrcs(row, photoIndex);
      const gallery = carousel(photos, `${reg} balloon`);
      if (photos.length) findMorePhotos(row.id, photos.length + 1, gallery.addPhoto);

      content.replaceChildren(
        el("article", { class: "detail" },
          gallery,
          el("div", {},
            el("header", { class: "detail-head" },
              el("h1", {}, reg),
              el("p", { class: "subtitle" }, subtitle || model || "—"),
              el("div", { class: "row" },
                statusPill(status),
                swatches(row),
                subtitle && model ? el("span", { class: "meta" }, model) : null)),
            fields)),
        el("nav", { class: "pager" },
          link(prev, `← ${markOf(prev)}`),
          link(next, `${markOf(next)} →`)));
    }

    Promise.all([loadBalloons(), loadPhotoIndex()]).then(render).catch((err) => {
      console.error(err);
      content.replaceChildren(el("p", { class: "error" }, "Couldn't load the register."));
    });
  </script>
</body>
</html>
